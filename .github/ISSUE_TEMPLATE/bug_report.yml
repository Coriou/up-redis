name: Bug report
description: Report reproducible incorrect behavior in up-redis.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not disclose security vulnerabilities here; use SECURITY.md.
  - type: input
    id: version
    attributes:
      label: up-redis version
      description: Use a release tag or commit SHA, not only "latest".
      placeholder: v1.0.1
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and backend
      description: Include Bun or image version and Redis/Valkey/KeyDB version.
      placeholder: Bun 1.3.14, Redis 8.2
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the request or SDK call, configuration with secrets removed, and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Redact tokens, credentials, and private endpoints.
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: Regression?
      options:
        - Unknown
        - "Yes"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and tested the latest release.
          required: true
        - label: I removed credentials and sensitive data.
          required: true
