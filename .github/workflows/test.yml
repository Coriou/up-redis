name: Test

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - package.json
      - bun.lock
      - tsconfig.json
      - biome.json
      - bunfig.toml
      - Dockerfile
      - .dockerignore
      - docker-compose*.yml
      - .env.example
      - .github/workflows/**
  pull_request:
    paths:
      - src/**
      - tests/**
      - package.json
      - bun.lock
      - tsconfig.json
      - biome.json
      - bunfig.toml
      - Dockerfile
      - .dockerignore
      - docker-compose*.yml
      - .env.example
      - .github/workflows/**

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests, lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      # --coverage is advisory (no failing threshold) — it surfaces coverage in the log.
      - run: bun test tests/unit --coverage
        env:
          UPREDIS_TOKEN: test

  integration:
    name: Integration + compatibility (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: redis:6-alpine
            health-cmd: redis-cli ping
          - backend: redis:7-alpine
            health-cmd: redis-cli ping
          - backend: redis:8-alpine
            health-cmd: redis-cli ping
          - backend: valkey/valkey:9-alpine
            health-cmd: valkey-cli ping
    services:
      redis:
        image: ${{ matrix.backend }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "${{ matrix.health-cmd }}"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UPREDIS_TOKEN: test-token-123
      UPREDIS_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Start up-redis
        run: |
          bun run src/index.ts > "$RUNNER_TEMP/upredis.log" 2>&1 &
          echo "UPREDIS_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server (readiness includes Redis)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "ready after ${i}s"; exit 0
            fi
            if ! kill -0 "$UPREDIS_PID" 2>/dev/null; then
              echo "::error::up-redis exited during startup"; cat "$RUNNER_TEMP/upredis.log"; exit 1
            fi
            sleep 1
          done
          echo "::error::up-redis did not become ready in 30s"; cat "$RUNNER_TEMP/upredis.log"; exit 1

      - name: Integration tests
        run: bun test tests/integration

      - name: SDK compatibility tests
        run: bun test tests/compatibility

      - name: up-redis logs (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/upredis.log" || true

  runtime-floor:
    name: Runtime floor (Bun 1.3.6)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UPREDIS_TOKEN: test-token-123
      UPREDIS_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun test tests/unit

      - name: Start up-redis
        run: |
          bun run src/index.ts > "$RUNNER_TEMP/upredis.log" 2>&1 &
          echo "UPREDIS_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "ready after ${i}s"; exit 0
            fi
            if ! kill -0 "$UPREDIS_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/upredis.log"; exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/upredis.log"; exit 1

      - run: bun test tests/integration
      - run: bun test tests/compatibility

      - name: up-redis logs (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/upredis.log" || true

  container:
    name: Container build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: upredis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan container for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: image
          image-ref: upredis:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Smoke test container
        env:
          UPREDIS_TOKEN: test-token-123
        run: |
          docker run --detach --name upredis-ci --network host --env UPREDIS_TOKEN --env UPREDIS_REDIS_URL=redis://127.0.0.1:6379 upredis:ci

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              response=$(curl -fsS http://localhost:8080 -H "Authorization: Bearer ${UPREDIS_TOKEN}" -H "Content-Type: application/json" --data '["PING"]')
              test "$response" = '{"result":"PONG"}'
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' upredis-ci | grep -q true; then
              docker logs upredis-ci; exit 1
            fi
            sleep 1
          done
          docker logs upredis-ci
          exit 1
