name: Test

on:
  push:
    branches: [main]
    paths: [src/**, tests/**, package.json, bun.lock, Dockerfile, .github/workflows/**]
  pull_request:
    paths: [src/**, tests/**, package.json, bun.lock, Dockerfile, .github/workflows/**]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # --coverage is advisory (no failing threshold) — it surfaces coverage in the log.
      - run: bun test tests/unit --coverage
        env:
          UPREDIS_TOKEN: test

  integration:
    name: Integration + Compatibility (${{ matrix.backend }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: redis:7-alpine
            health-cmd: redis-cli ping
          - backend: redis:8-alpine
            health-cmd: redis-cli ping
          - backend: valkey/valkey:9-alpine
            health-cmd: valkey-cli ping
    services:
      redis:
        image: ${{ matrix.backend }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "${{ matrix.health-cmd }}"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UPREDIS_TOKEN: test-token-123
      UPREDIS_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Start up-redis
        run: |
          bun run src/index.ts > "$RUNNER_TEMP/upredis.log" 2>&1 &
          echo "UPREDIS_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server (readiness incl. Redis)
        run: |
          for i in $(seq 1 30); do
            # /health (not /) returns 200 only when Redis is actually connected — so a
            # stale/misconfigured server can't pass readiness and silently fail every test.
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "ready after ${i}s"; exit 0
            fi
            # Fail fast (with logs) if the process died during startup instead of
            # exhausting the loop and running the suite against nothing.
            if ! kill -0 "$UPREDIS_PID" 2>/dev/null; then
              echo "::error::up-redis exited during startup"; cat "$RUNNER_TEMP/upredis.log"; exit 1
            fi
            sleep 1
          done
          echo "::error::up-redis did not become ready in 30s"; cat "$RUNNER_TEMP/upredis.log"; exit 1

      - name: Integration tests
        run: bun test tests/integration

      - name: SDK compatibility tests
        run: bun test tests/compatibility

      - name: up-redis logs (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/upredis.log" || true
