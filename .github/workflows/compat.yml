name: SDK Compatibility (latest)

on:
  schedule:
    - cron: "0 9 * * 1" # Monday 9 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sdk-compat-latest
  cancel-in-progress: true

jobs:
  compat-latest:
    name: Test against @upstash/redis@latest (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: redis:8-alpine
            health-cmd: redis-cli ping
          - backend: valkey/valkey:9-alpine
            health-cmd: valkey-cli ping
    services:
      redis:
        image: ${{ matrix.backend }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "${{ matrix.health-cmd }}"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UPREDIS_TOKEN: test-token-123
      UPREDIS_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Install latest @upstash/redis
        run: bun add -d @upstash/redis@latest

      - name: Capture SDK version
        id: sdk
        run: |
          VERSION=$(bun pm ls 2>/dev/null | grep @upstash/redis | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Testing against @upstash/redis@$VERSION"

      - name: Start up-redis
        run: |
          bun run src/index.ts > "$RUNNER_TEMP/upredis.log" 2>&1 &
          echo "UPREDIS_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server (readiness incl. Redis)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "ready after ${i}s"; exit 0
            fi
            if ! kill -0 "$UPREDIS_PID" 2>/dev/null; then
              echo "::error::up-redis exited during startup"; cat "$RUNNER_TEMP/upredis.log"; exit 1
            fi
            sleep 1
          done
          echo "::error::up-redis did not become ready in 30s"; cat "$RUNNER_TEMP/upredis.log"; exit 1

      - name: Run compatibility tests
        run: bun test tests/compatibility

      - name: up-redis logs (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/upredis.log" || true

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.sdk.outputs.version }}"
          TITLE="SDK Compat (${{ matrix.backend }}): @upstash/redis@${VERSION} test failures"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Check for existing open issue with same title
          EXISTING=$(gh issue list --search "$TITLE" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open for this version, skipping"
            exit 0
          fi

          gh issue create \
            --title "$TITLE" \
            --label "sdk-compat,automated" \
            --body "Scheduled compatibility tests failed against \`@upstash/redis@${VERSION}\`.

          **Workflow run:** ${RUN_URL}

          This likely means the SDK introduced changes that up-redis doesn't handle yet. Check the workflow logs for failing tests."
