name: Release

# On a version tag (e.g. `v1.0.0`):
# 1. Build and publish the container image to GHCR
# 2. Create a GitHub Release (tag alone does not create a Release)
#
# Until the first tag is pushed, `ghcr.io/coriou/up-redis:latest` does not exist —
# the docker-compose quick start uses `build: .` and does not depend on this.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege at workflow level. The github-release job elevates contents.
permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/coriou/up-redis
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    needs: docker
    # Tags alone do not create GitHub Releases; only run on v* tag pushes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          # Keep a Changelog: ## [1.0.1] - 2026-07-17 … until next ## heading
          # Escape dots so version is matched literally in awk.
          ver_re=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          awk -v ver_re="$ver_re" '
            $0 ~ ("^## \\[" ver_re "\\]") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG.md section for [${VERSION}]; using fallback body." >&2
            {
              echo "Release ${TAG}."
              echo
              echo "**Container image:** \`ghcr.io/coriou/up-redis:${VERSION}\`"
            } > "$NOTES_FILE"
          else
            {
              echo
              echo "**Container image:** \`ghcr.io/coriou/up-redis:${VERSION}\` (also tagged \`${VERSION%.*}\` / \`latest\` as applicable)."
              echo
              echo "**Full changelog:** https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md"
            } >> "$NOTES_FILE"
          fi

          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # v3 runs on Node 24 (v2 is EOL / Node 20).
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.path }}
          # Prepends CHANGELOG body to GitHub's auto-generated commit notes.
          generate_release_notes: true
          draft: false
          prerelease: false
