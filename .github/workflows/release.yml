name: Release

# A version tag (for example v1.1.0) is the only publish trigger. The workflow
# verifies the tag, changelog, source, tests, and container before touching GHCR.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UPREDIS_TOKEN: test-token-123
      UPREDIS_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Verify tag metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          actual="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$actual" = "$expected" || {
            echo "::error::Tag $TAG does not match package.json version $actual"
            exit 1
          }
          grep -Fq "## [$expected]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no [$expected] release section"
            exit 1
          }

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bun test tests/unit

      - name: Start up-redis
        run: |
          bun run src/index.ts > "$RUNNER_TEMP/upredis.log" 2>&1 &
          echo "UPREDIS_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "ready after ${i}s"; exit 0
            fi
            if ! kill -0 "$UPREDIS_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/upredis.log"; exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/upredis.log"; exit 1

      - run: bun test tests/integration
      - run: bun test tests/compatibility

      - name: up-redis logs (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/upredis.log" || true

  docker:
    name: Build & push multi-platform image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/coriou/up-redis
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract changelog section
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          ver_re=$(printf '%s' "$version" | sed 's/\./\\./g')
          # shellcheck disable=SC2016
          awk -v ver_re="$ver_re" '
            $0 ~ ("^## \\[" ver_re "\\]") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          test -s "$notes_file" || {
            echo "::error::CHANGELOG.md section [$version] is empty"
            exit 1
          }

          # shellcheck disable=SC2016
          printf '\n**Container image:** `%s` (also tagged `%s` and `latest`).\n\n' "ghcr.io/coriou/up-redis:${version}" "${version%.*}" >> "$notes_file"
          printf '**Full changelog:** %s\n' "https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md" >> "$notes_file"

          echo "path=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: false
